name: CI

env:
  TZ: America/Chicago

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-24.04
            arch: x64
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml/remindcore/pyproject.toml
            ml/remindspeak/pyproject.toml
            ml/planscan/pyproject.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install original-model training tools
        run: python -m pip install --disable-pip-version-check -e ml/remindcore -e ml/remindspeak -e ml/planscan

      - name: Cache offline speech model
        uses: actions/cache@v4
        with:
          path: models/asr/**/*.onnx
          key: release-asr-${{ hashFiles('models/manifest.json') }}

      - name: Restore and verify offline models
        run: pnpm models:fetch

      - name: Train and export RemindCore from scratch
        run: pnpm remindcore:train

      - name: Train and export RemindSpeak from scratch
        run: python ml/remindspeak/pipeline.py all

      - name: Train and export PlanScan from scratch
        run: python ml/planscan/pipeline.py all

      - name: Export ONNX parity kernels and first-launch probes
        run: pnpm models:onnx:export && pnpm release-probes:generate

      - name: Verify release on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm verify

      - name: Verify release
        if: runner.os != 'Linux'
        run: pnpm verify

      - name: Build platform directory package
        run: pnpm package:dir

      - name: Run packaged document release gate on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm documents:release:package

      - name: Run packaged document release gate
        if: runner.os != 'Linux'
        run: pnpm documents:release:package

      - name: Upload document release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-release-${{ runner.os }}-${{ matrix.arch }}
          path: evals/documents/reports/document-release.*.json
          if-no-files-found: warn

      - name: Audit platform directory package
        run: pnpm package:audit
